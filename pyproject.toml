[project]
name = "cortexdb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Armando Aguilar L.", email = "a.aguilar@gategeek.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cortexdb-client>=0.2.0",
    "google-adk>=2.13.0",
    "openpyxl>=3.1.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cortexdb = "cortexdb:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
